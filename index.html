<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Conjunto Manancial</title>
    <meta name="description" content="Sistema profissional para gerenciar hinos e repertórios de cultos" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icone.svg" />

    <!--
      ABERTURA DO APP

      Fica escrita aqui dentro, e não num componente, porque precisa aparecer
      antes do React carregar: é justamente o tempo em que a tela ficava branca.
      Quem a tira do ar é o Dashboard, quando termina de carregar
      (ver src/services/abertura.ts).

      O modelo, o fundo e o que aparece saem das Configurações > Abertura do
      Sistema. O CSS está todo aqui, mas em CLASSE (.abertura) e não em id, de
      propósito: a prévia das Configurações usa as mesmas classes, então o que
      a pessoa vê lá é a abertura de verdade, não um desenho parecido.

      Por que a nota é branca e não tem quadrado em volta no modelo padrão:
      no app instalado, o celular desenha antes a sua própria tela de abertura.
      Essa tela é do sistema, não dá para animar. Então o modelo padrão começa
      com o mesmo desenho, para emendar um no outro.
    -->
    <style>
      .abertura {
        /* Trocados pelas Configurações; estes são o padrão. */
        --abertura-fundo: linear-gradient(
          140deg,
          var(--cor-principal, #4f46e5),
          var(--cor-escura, #7c3aed)
        );
        --abertura-frente: #ffffff;
        /* Cor da nota dentro do cartão claro: tem de contrastar com a frente. */
        --abertura-nota: var(--cor-principal, #4f46e5);

        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background: var(--abertura-fundo);
        color: var(--abertura-frente);
        /* A saída é feita pela classe .saindo (ver services/abertura.ts). */
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }

      .abertura.saindo {
        opacity: 0;
        visibility: hidden;
      }

      .abertura-logo {
        position: relative;
        width: 104px;
        height: 104px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .abertura-logo svg {
        width: 64px;
        height: 64px;
        color: var(--abertura-frente);
      }

      /* Ondas e barras só aparecem nos modelos que as usam. */
      .abertura-onda,
      .abertura-barras {
        display: none;
      }

      .abertura-onda {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid currentColor;
        opacity: 0.45;
      }

      .abertura-barras {
        align-items: flex-end;
        gap: 6px;
        height: 64px;
      }

      .abertura-barras span {
        width: 8px;
        height: 100%;
        border-radius: 4px;
        background: currentColor;
        transform-origin: bottom;
      }

      .abertura-nome {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        /* A frase é escrita pelo usuário: pode ser um versículo inteiro. */
        max-width: 86vw;
        text-align: center;
        line-height: 1.45;
        overflow-wrap: break-word;
        animation: abertura-sobe 0.6s ease-out 0.15s both;
      }

      /* Três pontinhos pulsando, no lugar de uma barra de carregamento. */
      .abertura-pontos {
        display: flex;
        gap: 7px;
        animation: abertura-sobe 0.6s ease-out 0.3s both;
      }

      .abertura-pontos span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.85;
        animation: abertura-pulo 1s ease-in-out infinite;
      }

      .abertura-pontos span:nth-child(2) {
        animation-delay: 0.15s;
      }

      .abertura-pontos span:nth-child(3) {
        animation-delay: 0.3s;
      }

      /* Desligados nas Configurações. */
      .abertura[data-nome="nao"] .abertura-nome,
      .abertura[data-pontos="nao"] .abertura-pontos {
        display: none;
      }

      /* ==================== MODELOS ==================== */

      /* NOTA (padrão): a nota marcando o compasso, com ondas saindo dela. */
      .abertura[data-modelo="nota"] .abertura-logo svg {
        animation: abertura-balanco 1.6s ease-in-out 0.25s infinite;
      }

      .abertura[data-modelo="nota"] .abertura-onda {
        display: block;
        animation: abertura-onda 1.8s ease-out infinite;
      }

      .abertura[data-modelo="nota"] .abertura-onda.atrasada {
        animation-delay: 0.9s;
      }

      /* PULSO: a nota batendo como um coração, sem ondas. */
      .abertura[data-modelo="pulso"] .abertura-logo svg {
        animation: abertura-pulso 1.1s ease-in-out infinite;
      }

      /* CARTAO: a nota num quadrado claro, que entra crescendo e girando. */
      .abertura[data-modelo="cartao"] .abertura-logo {
        border-radius: 32px;
        background: var(--abertura-frente);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
        animation: abertura-entrada 0.75s cubic-bezier(0.22, 1.2, 0.36, 1) both;
      }

      .abertura[data-modelo="cartao"] .abertura-logo svg {
        width: 56px;
        height: 56px;
        /* No cartão a nota fica na cor do fundo, para aparecer no claro. */
        color: var(--abertura-nota);
        animation: abertura-balanco 1.6s ease-in-out 0.65s infinite;
      }

      /* EQUALIZADOR: barras dançando no lugar da nota. */
      .abertura[data-modelo="equalizador"] .abertura-logo svg {
        display: none;
      }

      .abertura[data-modelo="equalizador"] .abertura-barras {
        display: flex;
      }

      .abertura[data-modelo="equalizador"] .abertura-barras span {
        animation: abertura-barra 0.9s ease-in-out infinite;
      }

      .abertura[data-modelo="equalizador"] .abertura-barras span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .abertura[data-modelo="equalizador"] .abertura-barras span:nth-child(3) {
        animation-delay: 0.3s;
      }
      .abertura[data-modelo="equalizador"] .abertura-barras span:nth-child(4) {
        animation-delay: 0.45s;
      }
      .abertura[data-modelo="equalizador"] .abertura-barras span:nth-child(5) {
        animation-delay: 0.6s;
      }

      /* SIMPLES: logo parada, nada se mexe além dos pontinhos. */

      /* ==================== ANIMAÇÕES ==================== */

      @keyframes abertura-balanco {
        0%,
        55%,
        100% {
          transform: rotate(0deg) scale(1);
        }
        15% {
          transform: rotate(-9deg) scale(1.04);
        }
        35% {
          transform: rotate(9deg) scale(1.04);
        }
      }

      @keyframes abertura-pulso {
        0%,
        100% {
          transform: scale(1);
        }
        18% {
          transform: scale(1.16);
        }
        36% {
          transform: scale(1);
        }
        54% {
          transform: scale(1.1);
        }
      }

      @keyframes abertura-onda {
        from {
          opacity: 0.55;
          transform: scale(0.8);
        }
        to {
          opacity: 0;
          transform: scale(1.7);
        }
      }

      @keyframes abertura-entrada {
        from {
          opacity: 0;
          transform: scale(0.5) rotate(-14deg);
        }
        to {
          opacity: 1;
          transform: scale(1) rotate(0deg);
        }
      }

      @keyframes abertura-barra {
        0%,
        100% {
          transform: scaleY(0.3);
        }
        50% {
          transform: scaleY(1);
        }
      }

      @keyframes abertura-sobe {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes abertura-pulo {
        0%,
        100% {
          opacity: 0.35;
          transform: translateY(0);
        }
        50% {
          opacity: 1;
          transform: translateY(-5px);
        }
      }

      /*
       * Prévia das Configurações: mesma abertura, só encaixada numa caixinha
       * no meio da página em vez de cobrir a tela.
       */
      .abertura--previa {
        position: relative;
        inset: auto;
        z-index: 0;
        width: 100%;
        height: 190px;
        border-radius: 16px;
        overflow: hidden;
        gap: 14px;
        transform: scale(0.78);
      }

      .abertura--previa .abertura-logo {
        width: 72px;
        height: 72px;
      }

      .abertura--previa .abertura-logo svg,
      .abertura--previa .abertura-barras {
        width: 46px;
        height: 46px;
      }

      .abertura--previa .abertura-nome {
        font-size: 13px;
        max-width: 80%;
      }

      /* Quem pediu menos animação no aparelho vê só a logo parada. */
      @media (prefers-reduced-motion: reduce) {
        .abertura * {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="abertura" class="abertura" data-modelo="nota" role="status" aria-label="Abrindo o aplicativo">
      <div class="abertura-logo">
        <span class="abertura-onda"></span>
        <span class="abertura-onda atrasada"></span>

        <!-- Mesma nota musical do ícone do app (public/icone.svg). -->
        <svg viewBox="0 0 512 512" aria-hidden="true">
          <path
            d="M330 120v168a56 56 0 1 1-32-50V186l-96 24v134a56 56 0 1 1-32-50V180a24 24 0 0 1 18-23l120-30a24 24 0 0 1 22 5 24 24 0 0 1 0 18z"
            fill="currentColor"
          />
        </svg>

        <span class="abertura-barras">
          <span></span><span></span><span></span><span></span><span></span>
        </span>
      </div>

      <div class="abertura-nome">Conjunto Manancial</div>

      <div class="abertura-pontos">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <!--
      Aplica a escolha das Configurações antes de a tela ser pintada.

      Está escrito solto aqui, e não importado de services/abertura.ts, porque
      o módulo só chega depois do React: se esperasse por ele, a abertura
      apareceria no modelo padrão e trocaria na frente do usuário. São as
      mesmas chaves do arquivo aberturaPreferida() - mexeu em um, mexa no outro.
    -->
    <script>
      (function () {
        /*
         * COR ESCOLHIDA, ANTES DE QUALQUER COISA SER DESENHADA
         *
         * A abertura usa var(--cor-principal) / var(--cor-escura), mas quem
         * escreve essas variáveis no <html> é o services/tema.ts, que só roda
         * depois do React carregar. Até lá valia o índigo de fábrica, então a
         * tela inicial aparecia azul mesmo com o sistema em outra cor.
         *
         * Aqui lemos a cópia que o tema.ts deixa no aparelho
         * (repertorio:cores) e aplicamos na hora. O tema.ts aplica de novo
         * logo depois - o valor é o mesmo, então nada pisca.
         */
        try {
          var cores = JSON.parse(localStorage.getItem('repertorio:cores') || '{}') || {};
          var raiz = document.documentElement;

          if (cores.principal) {
            raiz.style.setProperty('--cor-principal', cores.principal);
            var barra = document.querySelector('meta[name="theme-color"]');
            if (barra) barra.setAttribute('content', cores.principal);
          }
          if (cores.escura) raiz.style.setProperty('--cor-escura', cores.escura);
          if (cores.clara) raiz.style.setProperty('--cor-clara', cores.clara);
          // Modo noturno já no primeiro quadro, para não piscar claro.
          if (cores.modo) raiz.dataset.modo = cores.modo;
        } catch (e) {
          /* sem cópia guardada: segue na cor de fábrica */
        }

        var abertura = document.getElementById('abertura');
        if (!abertura) return;

        var escolha = {};
        try {
          escolha = JSON.parse(localStorage.getItem('repertorio:abertura') || '{}') || {};
        } catch (e) {
          escolha = {};
        }

        // Desligada: nem chega a aparecer.
        if (escolha.modelo === 'nenhuma') {
          abertura.remove();
          return;
        }

        abertura.dataset.modelo = escolha.modelo || 'nota';
        abertura.dataset.nome = escolha.mostrarNome === false ? 'nao' : 'sim';
        abertura.dataset.pontos = escolha.mostrarPontos === false ? 'nao' : 'sim';

        // Frase escolhida nas Configurações, no lugar do nome do conjunto.
        var frase = (escolha.texto || '').trim();
        var alvo = abertura.querySelector('.abertura-nome');
        if (frase && alvo) alvo.textContent = frase;

        if (escolha.fundo === 'claro') {
          abertura.style.setProperty('--abertura-fundo', '#f8fafc');
          abertura.style.setProperty('--abertura-frente', 'var(--cor-principal, #4f46e5)');
          abertura.style.setProperty('--abertura-nota', '#f8fafc');
        } else if (escolha.fundo === 'escuro') {
          abertura.style.setProperty('--abertura-fundo', '#0f172a');
          abertura.style.setProperty('--abertura-frente', '#ffffff');
          abertura.style.setProperty('--abertura-nota', '#0f172a');
        } else if (escolha.fundo === 'personalizada' && escolha.cor) {
          abertura.style.setProperty('--abertura-fundo', escolha.cor);
          abertura.style.setProperty('--abertura-nota', escolha.cor);
          // Cor clara pede letra escura, cor escura pede letra branca.
          var rgb = escolha.cor.replace('#', '');
          var luz =
            (parseInt(rgb.slice(0, 2), 16) * 299 +
              parseInt(rgb.slice(2, 4), 16) * 587 +
              parseInt(rgb.slice(4, 6), 16) * 114) /
            1000;
          abertura.style.setProperty('--abertura-frente', luz > 150 ? '#111827' : '#ffffff');
        }
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
