<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Conjunto Manancial</title>
    <meta name="description" content="Sistema profissional para gerenciar hinos e repertórios de cultos" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icone.svg" />

    <!--
      ABERTURA DO APP

      Fica escrita aqui dentro, e não num componente, porque precisa aparecer
      antes do React carregar: é justamente o tempo em que a tela ficava branca.
      Quem a tira do ar é o Dashboard, quando termina de carregar
      (ver src/services/abertura.ts).

      IMPORTANTE - por que a nota é branca e não tem quadrado branco em volta:
      no app instalado, o celular desenha antes a sua própria tela de abertura,
      com o ícone de public/icone.svg (nota branca no roxo). Essa tela é do
      sistema, não dá para animar nem pular. Então esta aqui começa com o mesmo
      desenho e no mesmo tamanho: quando o sistema entrega a vez para o app,
      a nota continua no lugar e só começa a se mexer - em vez de aparecer uma
      segunda logo, diferente da primeira.
    -->
    <style>
      #abertura {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 26px;
        background: linear-gradient(
          140deg,
          var(--cor-principal, #4f46e5),
          var(--cor-escura, #7c3aed)
        );
        /* A saída é feita pela classe .saindo (ver services/abertura.ts). */
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }

      #abertura.saindo {
        opacity: 0;
        visibility: hidden;
      }

      /*
       * A nota, do mesmo tamanho do ícone do sistema. Sem animação de entrada
       * de propósito: ela já nasce pronta, para emendar na tela do celular.
       */
      .abertura-logo {
        position: relative;
        width: 104px;
        height: 104px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .abertura-logo svg {
        width: 64px;
        height: 64px;
        color: #fff;
        /* Balanço curto, como quem marca o compasso. */
        animation: abertura-balanco 1.6s ease-in-out 0.25s infinite;
      }

      /* Duas ondas saindo da nota, uma atrasada em relação à outra. */
      .abertura-onda {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.45);
        animation: abertura-onda 1.8s ease-out infinite;
      }

      .abertura-onda.atrasada {
        animation-delay: 0.9s;
      }

      .abertura-nome {
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #fff;
        animation: abertura-sobe 0.6s ease-out 0.15s both;
      }

      /* Três pontinhos pulsando, no lugar de uma barra de carregamento. */
      .abertura-pontos {
        display: flex;
        gap: 7px;
        animation: abertura-sobe 0.6s ease-out 0.3s both;
      }

      .abertura-pontos span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.85);
        animation: abertura-pulo 1s ease-in-out infinite;
      }

      .abertura-pontos span:nth-child(2) {
        animation-delay: 0.15s;
      }

      .abertura-pontos span:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes abertura-balanco {
        0%,
        55%,
        100% {
          transform: rotate(0deg) scale(1);
        }
        15% {
          transform: rotate(-9deg) scale(1.04);
        }
        35% {
          transform: rotate(9deg) scale(1.04);
        }
      }

      @keyframes abertura-onda {
        from {
          opacity: 0.55;
          transform: scale(0.8);
        }
        to {
          opacity: 0;
          transform: scale(1.7);
        }
      }

      @keyframes abertura-sobe {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes abertura-pulo {
        0%,
        100% {
          opacity: 0.35;
          transform: translateY(0);
        }
        50% {
          opacity: 1;
          transform: translateY(-5px);
        }
      }

      /* Quem pediu menos animação no aparelho vê só a logo parada. */
      @media (prefers-reduced-motion: reduce) {
        #abertura * {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="abertura" role="status" aria-label="Abrindo o aplicativo">
      <div class="abertura-logo">
        <span class="abertura-onda"></span>
        <span class="abertura-onda atrasada"></span>
        <!-- Mesma nota musical do ícone do app (public/icone.svg). -->
        <svg viewBox="0 0 512 512" aria-hidden="true">
          <path
            d="M330 120v168a56 56 0 1 1-32-50V186l-96 24v134a56 56 0 1 1-32-50V180a24 24 0 0 1 18-23l120-30a24 24 0 0 1 22 5 24 24 0 0 1 0 18z"
            fill="currentColor"
          />
        </svg>
      </div>

      <div class="abertura-nome">Conjunto Manancial</div>

      <div class="abertura-pontos">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
